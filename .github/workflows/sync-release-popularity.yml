name: Sync release popularity

on:
  workflow_dispatch:
  schedule:
    - cron: '47 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/sync_igdb_popularity.py'
      - '.github/workflows/sync-release-popularity.yml'

permissions:
  contents: write

concurrency:
  group: gamedrop-release-popularity
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build IGDB popularity feed
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/sync_igdb_popularity.py
          python3 scripts/sync_igdb_popularity.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/releases/popularity.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data.get('gameCount', 0) > 0
          assert len(data.get('games') or {}) == data['gameCount']
          top = sorted(data['games'].items(), key=lambda x: x[1].get('score', 0), reverse=True)[:5]
          print('Top popularity sample:', top)
          print('Popularity bytes:', p.stat().st_size)
          PY
      - name: Publish popularity feed with conflict retry
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/releases/popularity.json
          if git diff --cached --quiet; then
            echo "No popularity changes."
            exit 0
          fi
          git commit -m "data: refresh release popularity [skip ci]"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              echo "Popularity feed published."
              exit 0
            fi
            echo "Push raced with another feed writer; rebasing (attempt ${attempt}/4)."
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          echo "ERROR: could not publish popularity feed after retries."
          exit 1
