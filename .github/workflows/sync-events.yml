name: Sync gaming events

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/sync_public_events.py'
      - 'scripts/sync_major_events.py'
      - 'scripts/sync_igdb_events.py'
      - 'scripts/finalize_event_feed.py'
      - 'scripts/test_event_merge.py'
      - '.github/workflows/sync-events.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/sync_public_events.py'
      - 'scripts/sync_major_events.py'
      - 'scripts/sync_igdb_events.py'
      - 'scripts/finalize_event_feed.py'
      - 'scripts/test_event_merge.py'
      - '.github/workflows/sync-events.yml'

permissions:
  contents: write

concurrency:
  group: gamedrop-main-generated-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate event feed code
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/sync_public_events.py \
            scripts/sync_major_events.py \
            scripts/sync_igdb_events.py \
            scripts/finalize_event_feed.py \
            scripts/test_event_merge.py
          PYTHONPATH=scripts python3 scripts/test_event_merge.py

      - name: Build and validate IGDB event feed
        id: igdb
        shell: bash
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          EVENT_FEED_OUT: data/events-feed-igdb.json
        run: |
          set -euo pipefail
          if [ -n "${IGDB_CLIENT_ID}" ] && [ -n "${IGDB_CLIENT_SECRET}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "IGDB configured: authenticating and generating event enrichment feed."
            python3 scripts/sync_igdb_events.py
            python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/events-feed-igdb.json')
          feed = json.loads(p.read_text(encoding='utf-8'))
          events = feed.get('events') or []
          with_games = sum(1 for e in events if e.get('games'))
          assert events, 'IGDB returned zero events'
          assert with_games, 'IGDB returned zero events with games'
          print(f'IGDB events: events={len(events)}, withGames={with_games}')
          PY
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "IGDB secrets are not configured; public event feed will use its fallbacks."
          fi

      - name: Sync official public event sources
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/sync_public_events.py
          python3 scripts/sync_major_events.py

      - name: Finalize and validate event feed
        shell: bash
        env:
          IGDB_CONFIGURED: ${{ steps.igdb.outputs.configured }}
        run: |
          set -euo pipefail
          python3 scripts/finalize_event_feed.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/events-feed.json')
          feed = json.loads(p.read_text(encoding='utf-8'))
          events = feed.get('events') or []
          assert events, 'Final event feed is empty'
          assert feed.get('generatedAt')
          assert feed.get('source')
          assert feed.get('eventCount') == len(events)
          if feed.get('igdbConfigured'):
              assert feed.get('igdbRawEvents', 0) > 0
              assert feed.get('igdbRawEventsWithGames', 0) > 0
              assert feed.get('igdbEnrichedEvents', 0) > 0
          print('Event validation:', {
              'eventCount': feed.get('eventCount'),
              'igdbEnrichedEvents': feed.get('igdbEnrichedEvents'),
              'bytes': p.stat().st_size,
          })
          print('Recent gamescom/Xbox showcase audit:')
          for event in events:
              name = (event.get('name') or '').lower()
              start = event.get('startAt') or event.get('startTime') or ''
              if ('gamescom' in name or 'xbox' in name) and start.startswith('2026-08'):
                  print(f"- {event.get('name')}: games={len(event.get('games') or [])}, videos={len(event.get('videos') or [])}")
          PY
          rm -f data/events-feed-igdb.json

      - name: Publish event feed with conflict retry
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events-feed.json
          if git diff --cached --quiet; then
            echo "No event feed changes."
            exit 0
          fi
          git commit -m "data: refresh gaming events [skip ci]"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              echo "Event feed published."
              exit 0
            fi
            echo "Push raced with another feed writer; rebasing (attempt ${attempt}/4)."
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          echo "ERROR: could not publish event feed after retries."
          exit 1
