name: Sync gaming events

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/sync_public_events.py'
      - 'scripts/sync_major_events.py'
      - 'scripts/sync_igdb_events.py'
      - 'scripts/finalize_event_feed.py'
      - 'scripts/test_event_merge.py'
      - '.github/workflows/sync-events.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/sync_public_events.py'
      - 'scripts/sync_major_events.py'
      - 'scripts/sync_igdb_events.py'
      - 'scripts/finalize_event_feed.py'
      - 'scripts/test_event_merge.py'
      - '.github/workflows/sync-events.yml'

permissions:
  contents: write

concurrency:
  group: gamedrop-event-feed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate event merge logic
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/sync_public_events.py scripts/sync_major_events.py scripts/sync_igdb_events.py scripts/finalize_event_feed.py scripts/test_event_merge.py
          PYTHONPATH=scripts python3 scripts/test_event_merge.py

      - name: Build and validate IGDB feed
        id: igdb
        shell: bash
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          EVENT_FEED_OUT: data/events-feed-igdb.json
        run: |
          set -euo pipefail
          if [ -n "${IGDB_CLIENT_ID}" ] && [ -n "${IGDB_CLIENT_SECRET}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "IGDB configured: authenticating and generating enrichment feed."
            python3 scripts/sync_igdb_events.py
            python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/events-feed-igdb.json')
          feed = json.loads(p.read_text(encoding='utf-8'))
          events = feed.get('events') or []
          with_games = sum(1 for e in events if e.get('games'))
          assert events, 'IGDB returned zero events'
          assert with_games, 'IGDB returned zero events with games'
          print(f'IGDB validation: events={len(events)}, withGames={with_games}')
          PY
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "IGDB secrets are not configured; using official public sources only."
          fi

      - name: Sync official public event sources
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/sync_public_events.py
          python3 scripts/sync_major_events.py

      - name: Finalize and compact feed
        shell: bash
        env:
          IGDB_CONFIGURED: ${{ steps.igdb.outputs.configured }}
        run: |
          set -euo pipefail
          python3 scripts/finalize_event_feed.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/events-feed.json')
          feed = json.loads(p.read_text(encoding='utf-8'))
          assert feed.get('events'), 'Final feed is empty'
          assert feed.get('generatedAt')
          assert feed.get('source')
          assert feed.get('eventCount') == len(feed['events'])
          if feed.get('igdbConfigured'):
              assert feed.get('igdbRawEvents', 0) > 0
              assert feed.get('igdbRawEventsWithGames', 0) > 0
              assert feed.get('igdbEnrichedEvents', 0) > 0
          print('Final validation:', {
              'eventCount': feed.get('eventCount'),
              'igdbConfigured': feed.get('igdbConfigured'),
              'igdbRawEvents': feed.get('igdbRawEvents'),
              'igdbRawEventsWithGames': feed.get('igdbRawEventsWithGames'),
              'igdbEnrichedEvents': feed.get('igdbEnrichedEvents'),
              'bytes': p.stat().st_size,
          })
          PY
          rm -f data/events-feed-igdb.json

      - name: Guard against accidental empty feed
        shell: bash
        run: |
          set -euo pipefail
          NEW_COUNT=$(python3 -c "import json; print(len(json.load(open('data/events-feed.json'))['events']))")
          OLD_COUNT=$(git show HEAD:data/events-feed.json 2>/dev/null | python3 -c "import json,sys; print(len(json.load(sys.stdin).get('events', [])))" || echo 0)
          echo "Old feed: ${OLD_COUNT}; new feed: ${NEW_COUNT}"
          if [ "${NEW_COUNT}" -eq 0 ]; then
            echo "ERROR: refusing to publish an empty feed."
            exit 1
          fi

      - name: Commit refreshed feed
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/events-feed.json; then
            echo "No feed changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events-feed.json
          git commit -m "data: refresh gaming events feed [skip ci]"
          git push
